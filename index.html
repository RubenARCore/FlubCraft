<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="FlubCraft – дигитални решения за реалния бизнес. Уеб разработка, 3D конфигуратори, бизнес софтуер и автоматизация.">
<title>FlubCraft – Дигитални решения за реалния бизнес</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;background:#101217;color:#fff;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center}
main{flex:1;display:grid;place-items:center;padding:48px 24px}
.hero{max-width:960px}
.brand{font-size:clamp(3rem,9vw,6rem);font-weight:800;letter-spacing:-.065em;margin:0 0 32px;line-height:1.1}
.brand span{color:#60a5fa}
h1{font-size:clamp(1.5rem,4vw,2.75rem);line-height:1.25;letter-spacing:-.035em;margin:0 0 24px;font-weight:650}
.services{display:flex;flex-wrap:wrap;justify-content:center;gap:12px 24px;padding:0;margin:0;color:#a1a1aa;list-style:none;font-size:clamp(.95rem,2vw,1.1rem)}
.rule{width:48px;height:2px;background:#60a5fa;margin:40px auto}
.status{color:#a1a1aa;line-height:1.8;margin:0}
footer{border-top:1px solid #27272a;padding:24px;color:#a1a1aa;font-size:.85rem}
</style>
</head>
<body>
<main>
<section class="hero" aria-labelledby="headline">
<p class="brand">Flub<span>Craft</span></p>
<h1 id="headline">Дигитални решения за реалния бизнес.</h1>
<ul class="services"><li>Уеб разработка</li><li>3D конфигуратори</li><li>Бизнес софтуер</li><li>Автоматизация</li></ul>
<div class="rule" aria-hidden="true"></div>
<p class="status">Изграждаме нещо ново.<br>Очаквайте скоро.</p>
</section>
</main>
<footer>© 2026 FlubCraft</footer>
</body>
</html>
